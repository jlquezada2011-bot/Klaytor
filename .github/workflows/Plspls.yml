name: Build Klaytor Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          check-latest: false
      - name: Check Node
        run: |
          node --version
          npm --version
      - name: Install Dependencies
        run: npm install
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android
        uses: android-actions/setup-android@v3
      - name: Build Klaytor
        run: npm run build
      - name: Setup Capacitor
        run: |
          if [ ! -f capacitor.config.json ]; then
            echo '{
              "appId": "com.klaytor.app",
              "appName": "Klaytor",
              "webDir": "dist",
              "server": {
                "androidScheme": "https"
              }
            }' > capacitor.config.json
          fi
      - name: Create Android Project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Klaytor-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
