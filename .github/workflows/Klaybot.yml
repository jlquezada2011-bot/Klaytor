{
  "name": "klaytor",
  "private": true,
  "type": "module",
  "scripts": {
    "dev": "vite",
    "build": "tsc && vite build",
    "preview": "vite preview"
  },
  "dependencies": {
    "@capacitor/android": "^6.0.0",
    "@capacitor/core": "^6.0.0",
    "lucide-react": "^0.344.0",
    "react": "^18.3.1",
    "react-dom": "^18.3.1"
  },
  "devDependencies": {
    "@capacitor/cli": "^6.0.0",
    "@types/react": "^18.3.3",
    "@types/react-dom": "^18.3.0",
    "@vitejs/plugin-react": "^4.3.1",
    "autoprefixer": "^10.4.19",
    "postcss": "^8.4.38",
    "tailwindcss": "^3.4.4",
    "typescript": "^5.5.3",
    "vite": "^5.4.2"
  }
}
{
  "appId": "com.klaytor.app",
  "appName": "Klaytor",
  "webDir": "dist",
  "server": {
    "androidScheme": "https"
  }
}
name: Build Klaytor Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Audit & Build Web Assets
        run: npm run build

      - name: Initialize & Sync Capacitor Native Shell
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Ensure Gradle Execution Permissions
        run: chmod +x android/gradlew

      - name: Compile Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Build Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: Klaytor-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
