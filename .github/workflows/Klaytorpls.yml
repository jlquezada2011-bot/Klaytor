name: Build Klaytor Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      VITE_API_BASE_URL: ${{ secrets.KLAYTOR_API_BASE_URL }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Build web assets for Capacitor
        run: npm run build:android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Capacitor Android project
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Verify Capacitor project
        run: npx cap doctor

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Klaytor APK
        uses: actions/upload-artifact@v4
        with:
          name: Klaytor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
