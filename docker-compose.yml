version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: klaytor_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=klaytor-super-secure-production-jwt-secret-key-2026
      - DATABASE_URL=postgresql://klaytor_user:klaytor_password@postgres:5432/klaytor_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: klaytor_postgres
    environment:
      POSTGRES_USER: klaytor_user
      POSTGRES_PASSWORD: klaytor_password
      POSTGRES_DB: klaytor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations
      - ./database/seed:/docker-entrypoint-initdb.d/seed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klaytor_user -d klaytor_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
